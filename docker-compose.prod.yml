services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcook-backend-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/smartcook_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=*
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
    networks:
      - smartcook-prod-net

  web:
    build:
      context: ../smartcook-web
      dockerfile: Dockerfile
    container_name: smartcook-web-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartcook-prod-net

  redis:
    image: redis:7-alpine
    container_name: smartcook-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcook-prod-net

  mongo:
    image: mongo:7.0
    container_name: smartcook-mongo-prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcook-prod-net

networks:
  smartcook-prod-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  backend-logs:
    driver: local
