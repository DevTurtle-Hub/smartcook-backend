services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcook-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smartcook_db
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - smartcook-network

  mongo:
    image: mongo:7.0
    container_name: smartcook-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smartcook-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  smartcook-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
