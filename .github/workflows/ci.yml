name: SmartCook Backend CI / CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # Job 1: Code Quality, Lint & TypeScript Build
  # ==========================================
  code-quality-and-build:
    name: Lint & Build (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      - name: TypeScript Type Checking (Lint)
        run: npm run lint

      - name: Compile TypeScript to Production Bundle
        run: npm run build

  # ==========================================
  # Job 2: Verify Production Docker Multi-Stage Build
  # ==========================================
  docker-build-verification:
    name: Verify Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: code-quality-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smartcook-backend:production-test
